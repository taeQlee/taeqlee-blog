<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Text layout on an 800 by 600 pixel canvas</title>
  <desc id="desc">Characters spaced 13 pixels apart, with example positions 13, 26, 39, 52, and 793. The diagram lists a 16 pixel font size and 60 total characters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#171717"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#f01818"/>
    </marker>
  </defs>
  <rect width="1536" height="1024" fill="white"/>
  <g fill="none" stroke="#171717" stroke-width="3">
    <rect x="174" y="156" width="1325" height="811"/>
    <path d="M 174 71 V 121 M 1499 71 V 121 M 85 156 H 151 M 85 967 H 151" stroke-width="2"/>
    <path d="M 177 92 H 1496" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 109 159 V 964" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 218 454 H 1460" stroke-width="2"/>
    <rect x="270" y="376" width="60" height="60"/>
    <rect x="454" y="376" width="60" height="60"/>
    <rect x="618" y="376" width="60" height="60"/>
    <rect x="789" y="376" width="60" height="60"/>
    <rect x="1339" y="376" width="60" height="60"/>
    <path d="M 300 436 V 481 M 484 436 V 481 M 648 436 V 481 M 819 436 V 481 M 1369 436 V 481" stroke-width="2"/>
  </g>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif" fill="#111" text-anchor="middle">
    <text x="812" y="72" font-size="46">800 px</text>
    <rect x="8" y="473" width="150" height="86" fill="white"/>
    <text x="84" y="532" font-size="46">600 px</text>
    <g font-size="34">
      <text x="300" y="325">1</text>
      <text x="484" y="325">2</text>
      <text x="648" y="325">3</text>
      <text x="819" y="325">4</text>
      <text x="1369" y="325">60</text>
      <text x="300" y="520">13</text>
      <text x="484" y="520">26</text>
      <text x="648" y="520">39</text>
      <text x="819" y="520">52</text>
      <text x="1369" y="520">793</text>
    </g>
    <g font-size="50" letter-spacing="8">
      <text x="977" y="408">···</text>
      <text x="1112" y="408">···</text>
      <text x="1230" y="408">···</text>
    </g>
    <text x="392" y="377" font-size="34" fill="#f01818">13 px</text>
    <g text-anchor="start" font-size="30">
      <text x="1100" y="787">Font size : (예시) 16 px</text>
      <text x="1100" y="830">Letter spacing (자간) : 13 px</text>
      <text x="1100" y="873">Total characters : 60</text>
      <text x="1100" y="916">Last character x : 793 px</text>
    </g>
  </g>
  <path d="M 334 405 H 450" stroke="#f01818" stroke-width="2" marker-start="url(#red-arrow)" marker-end="url(#red-arrow)"/>
</svg>
